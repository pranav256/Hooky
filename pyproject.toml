[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziv"
version = "1.0.0"
description = "Ziv: terminal-first video clipping and Instagram Reel workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["ziv", "video", "instagram", "reels", "subtitles", "gemini", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "google-genai>=1.0.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
instagram = ["instagrapi>=2.1.0"]
download = ["yt-dlp>=2024.10.22"]
all = ["instagrapi>=2.1.0", "yt-dlp>=2024.10.22"]

[project.scripts]
ziv = "ziv.cli:main"
ziv-parts = "ziv.parts_cli:main"

[tool.setuptools.packages.find]
include = ["ziv*"]

[tool.setuptools.package-data]
"ziv.parts" = ["README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: slow ffmpeg/media integration checks",
]
