[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hooky"
version = "1.0.0"
description = "Hooky: Autonomous AI video clipping and Instagram Reel workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
core = [
    "google-genai>=1.0.0",
    "faster-whisper>=1.0.0",
]
download = ["yt-dlp>=2024.10.22"]
instagram = ["instagrapi>=2.1.0"]
all = [
    "google-genai>=1.0.0",
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.10.22",
    "instagrapi>=2.1.0",
]
dev = [
    "build>=1.2.2",
    "check-wheel-contents>=0.6.0",
    "pytest>=8.0",
    "twine>=5.1.1",
]

[project.scripts]
hooky = "hooky.cli:main"
hooky-parts = "hooky.parts_cli:main"
ziv = "hooky.cli:main"
ziv-parts = "hooky.parts_cli:main"

[tool.setuptools.packages.find]
include = ["hooky*"]
exclude = ["tests", "tests.*", "hooky.tests", "hooky.tests.*"]
namespaces = false

[tool.setuptools.package-data]
"hooky.parts" = ["README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: slow ffmpeg/media integration checks",
]
